spring.docker.compose.enabled=false
badrlink.user-service.url=http://localhost:18082
badrlink.security.internal-token=test-internal-secret
badrlink.security.jwt.issuer=messaging-auth-service-test
badrlink.kafka.enabled=false
# Actuator runs on its own port (9090) in the real deployment. Spring caches test contexts,
# so more than one @SpringBootTest context would try to bind that fixed port; 0 lets each
# context pick a free one. Prometheus never scrapes a test JVM.
management.server.port=0
