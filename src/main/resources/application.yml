spring:
  application:
    name: messaging-auth-service
  docker:
    compose:
      enabled: false
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Spring Kafka reads spring.kafka.*, not badrlink.kafka.*. Without this the consumer
  # and producer fell back to localhost:9092 inside the container and never reached the
  # broker, which also made the outbox metrics and traces meaningless over Kafka.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    transport-protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.from: ${MAIL_FROM:}

server:
  port: 8081

# Actuator is served on its own port: Prometheus scrapes it over the Docker network,
# while the application port keeps the existing security configuration untouched.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # Readiness covers the stores Auth cannot serve without; liveness stays on readinessState.
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}

badrlink:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    outbox:
      relay-interval: ${KAFKA_RELAY_INTERVAL:500ms}
      batch-size: ${KAFKA_RELAY_BATCH:50}
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      topic: badrlink.auth.credential.v1
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  security:
    internal-token: ${INTERNAL_HMAC_SECRET}
    jwt:
      access-token-ttl: ${JWT_ACCESS_TTL}
      refresh-token-ttl: ${JWT_REFRESH_TTL}
      issuer: ${JWT_ISSUER:http://localhost:8081}
      audience: ${JWT_AUDIENCE:messaging-api}
      key-id: ${JWT_RSA_KEY_ID:}
    lockout:
      max-failed-attempts: ${LOCKOUT_MAX_ATTEMPTS}
      duration: ${LOCKOUT_DURATION}
    password-reset:
      token-ttl: ${PASSWORD_RESET_TTL:PT15M}
    email:
      from: ${MAIL_FROM:}
      reset-cooldown: ${MAIL_RESET_COOLDOWN:PT2M}
      hourly-limit: ${MAIL_HOURLY_LIMIT:20}
      failure-threshold: ${MAIL_FAILURE_THRESHOLD:3}
      failure-cooldown: ${MAIL_FAILURE_COOLDOWN:PT5M}
  observability:
    outbox:
      refresh-interval: ${OUTBOX_METRICS_INTERVAL:15s}

# Structured JSON logs. The OpenTelemetry agent puts trace_id/span_id into the MDC, and
# Boot's logstash format writes the MDC into the JSON object, so no custom encoder is
# needed and the trace context also survives Kafka consumer threads.
logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
        prefix: ""
